[package]
name = "my_discord_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6"
serenity = "0.12"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "parking_lot"] }
mimalloc = "0.1"
num_cpus = "1.0"
dashmap = "6.0"
dotenvy = "0.15"


[[bin]]
name = "my_discord_bot"
path = "src/bot.rs"
